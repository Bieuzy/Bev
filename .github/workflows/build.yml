# Construit Bev à chaque envoi de code :
#  - Windows : un INSTALLATEUR (Bev-Setup-x.y.z.exe : menu Démarrer, raccourci, désinstallation, mises à jour) ;
#  - Mac : une image disque (.dmg).
# Et les attache automatiquement à chaque « Release » publiée (v1.1.0, v1.1.1…).
name: Construire Bev

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      captures_seules:
        description: "Seulement les captures d'écran de l'interface (sans construire Windows / Mac)"
        type: boolean
        default: false

# Droits minimaux : lecture seule par défaut. Seules les tâches qui joignent des fichiers à une Release (ou publient la
# branche « captures ») reçoivent le droit d'écriture, chacune pour elle-même.
permissions:
  contents: read

# Signature de code Windows (facultative, recommandée) : avec un compte Azure Artifact Signing (ex-Trusted Signing),
# l'exécutable et l'installateur sont signés au nom de l'éditeur : SmartScreen, Smart App Control et les antivirus les
# reconnaissent. Pour l'activer, renseigner dans Settings > Secrets and variables > Actions :
#   secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   variables AZURE_SIGN_ENDPOINT (ex. https://weu.codesigning.azure.net/), AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE
# Sans ces réglages, la construction se fait comme avant (non signée).
env:
  SIGN: ${{ vars.AZURE_SIGN_ACCOUNT != '' && 'oui' || '' }}
  # FFmpeg FIGÉ : une version stable précise, et non plus la version de développement du jour (« master-latest ») qui
  # changeait d'une construction à l'autre sans que le code de Bev ait bougé. Pour changer de version : modifier ces
  # lignes ET l'empreinte (sha256 du .zip, publiée par gyan.dev à côté de chaque version).
  FFMPEG_WIN_VERSION: "9.0.2"
  FFMPEG_WIN_SHA256: "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
  FFMPEG_MAC_MAJOR: "9.0"

jobs:
  # Tests automatiques (tests/) et vérification de l'interface depuis le code source, avant toute publication.
  tests:
    if: ${{ !inputs.captures_seules }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: ffmpeg et bibliothèques système de Qt
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Vérification de l'interface (selftest, depuis le code source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python broadcast_tool_qt.py --selftest || { cat selftest.txt; exit 1; }
          cat selftest.txt

  # Captures d'écran de l'interface (artefact « captures ») : à chaque envoi de code, pour voir l'effet d'une modification.
  captures:
    runs-on: ubuntu-latest
    permissions:
      contents: write                        # (branche « captures », à la demande seulement)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Bibliothèques système
        timeout-minutes: 4                   # (un miroir apt lent ne doit pas bloquer les captures : Qt est presque toujours là)
        continue-on-error: true
        run: sudo apt-get install -y -qq --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Captures
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/captures.py captures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: captures
          path: |
            captures/*.png
            captures/rapport.txt
      # À la demande seulement : captures aussi publiées sur la branche « captures » (consultables sans télécharger d'artefact)
      - name: Branche « captures »
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures

  windows:
    if: ${{ !inputs.captures_seules }}
    runs-on: windows-latest
    permissions:
      contents: write                        # (joindre l'installateur à la Release)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Modules Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow
          # Chargeur (bootloader) de PyInstaller compilé ici même, au lieu du chargeur générique précompilé : celui-ci est
          # partagé par des milliers de programmes (malveillants compris) et Defender le signale souvent à tort.
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller pyinstaller

      - name: ffmpeg (Windows, version figée et vérifiée)
        shell: pwsh
        run: |
          $v = $env:FFMPEG_WIN_VERSION
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile ff.zip
          $h = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_WIN_SHA256) { throw "Empreinte FFmpeg inattendue ($h) : téléchargement refusé" }
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item fftmp\*\bin\ffmpeg.exe, fftmp\*\bin\ffprobe.exe, fftmp\*\bin\ffplay.exe ffmpeg\
          Copy-Item fftmp\*\LICENSE ffmpeg\LICENSE-ffmpeg.txt
          ffmpeg\ffmpeg.exe -version | Select-Object -First 1
          # Encodeurs indispensables à Bev : la construction s'arrête s'il en manque un
          $enc = (ffmpeg\ffmpeg.exe -hide_banner -encoders) -join "`n"
          foreach ($e in "libmp3lame", "libopus", "libvorbis", " aac ", " flac ") {
            if ($enc -notmatch [regex]::Escape($e)) { throw "Encodeur absent de FFmpeg : $e" }
          }

      - name: Icône, image de démarrage, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      # Application en DOSSIER (et non plus en un seul .exe) : plus de décompression de 260 Mo à chaque lancement,
      # Bev s'ouvre en quelques secondes ; l'image de démarrage s'affiche dès le double-clic.
      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name Bev --noupx
          --icon build/icon.ico
          --version-file build/version_info.txt
          --splash build/splash.png
          --add-binary "ffmpeg/ffmpeg.exe;bin"
          --add-binary "ffmpeg/ffprobe.exe;bin"
          --add-binary "ffmpeg/ffplay.exe;bin"
          --collect-all sounddevice
          --hidden-import pyaudiowpatch
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Signature de Bev.exe et des outils (si configurée)
        if: env.SIGN == 'oui'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Bev
          # exe ET dll/pyd : Smart App Control contrôle chaque module chargé (Python, Qt, numpy…), pas seulement Bev.exe
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Vérification automatique (selftest)
        shell: pwsh
        run: |
          $env:PYINSTALLER_SUPPRESS_SPLASH_SCREEN = "1"
          $p = Start-Process -FilePath dist\Bev\Bev.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest en échec" }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content build\version.txt).Trim()
          & $iscc "/DMyAppVersion=$ver" installer\bev.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en échec" }
          Get-ChildItem dist-installer

      - name: Signature de l'installateur (si configurée)
        if: env.SIGN == 'oui'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Bev-Windows-installateur
          path: |
            dist-installer/Bev-Setup-*.exe
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $f = Get-ChildItem dist-installer\Bev-Setup-*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $f.FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    if: ${{ !inputs.captures_seules }}
    runs-on: macos-latest
    permissions:
      contents: write                        # (joindre le .dmg à la Release)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: ffmpeg (Mac, dernière version STABLE vérifiée)
        # (pas de version figée disponible chez ce fournisseur : on prend la dernière version stable — jamais une
        # version de développement —, on vérifie son empreinte publiée et on exige la même branche que Windows)
        run: |
          mkdir -p ffmpeg
          for t in ffmpeg ffprobe ffplay; do
            curl -fsSL -o "$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip"
            if curl -fsSL -o "$t.zip.sha256" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip.sha256"; then
              want=$(awk '{print $1}' "$t.zip.sha256"); got=$(shasum -a 256 "$t.zip" | awk '{print $1}')
              [ "$want" = "$got" ] || { echo "Empreinte $t inattendue"; exit 1; }
            fi
            unzip -o -q "$t.zip" -d ffmpeg
          done
          chmod +x ffmpeg/*
          ffmpeg/ffmpeg -version | head -1
          ffmpeg/ffmpeg -version | head -1 | grep -q "version $FFMPEG_MAC_MAJOR" || { echo "FFmpeg Mac : branche différente de $FFMPEG_MAC_MAJOR"; exit 1; }
          enc=$(ffmpeg/ffmpeg -hide_banner -encoders)
          for e in libmp3lame libopus libvorbis; do echo "$enc" | grep -q "$e" || { echo "Encodeur absent : $e"; exit 1; }; done

      - name: Icône, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Bev
          --icon build/icon.icns
          --osx-bundle-identifier fr.radio.bev
          --add-binary "ffmpeg/ffmpeg:bin"
          --add-binary "ffmpeg/ffprobe:bin"
          --add-binary "ffmpeg/ffplay:bin"
          --add-data "LICENSE:licences"
          --add-data "licences:licences"
          --collect-all sounddevice
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Autorisation micro + signature locale
        run: |
          P=dist/Bev.app/Contents/Info.plist
          plutil -insert NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P" || \
          plutil -replace NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P"
          plutil -insert NSHighResolutionCapable -bool true "$P" || true
          codesign --force --deep --sign - dist/Bev.app

      - name: Vérification automatique (selftest)
        run: |
          QT_QPA_PLATFORM=offscreen dist/Bev.app/Contents/MacOS/Bev --selftest
          cat selftest.txt

      - name: Image disque (.dmg)
        run: |
          mkdir -p dmg && cp -R dist/Bev.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Bev -srcfolder dmg -ov -format UDZO Bev-macOS.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Bev-macOS
          path: |
            Bev-macOS.dmg
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.ref_name }}" Bev-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Mise à jour express : le code de cette version (~1 Mo) + son manifeste, joints à la Release. Les Bev déjà installés
  # passent à la nouvelle version sans installateur (voir tools/express.py et _express_boot dans broadcast_tool_qt.py).
  # needs : le code express n'est joint à la Release qu'une fois les tests, les deux constructions ET leur selftest réussis. Avant, il
  # partait en parallèle : une version qui ne démarrait pas était quand même proposée en express à tous les Bev installés.
  # Mac indisponible chez GitHub (« job not acquired » : pénurie de machines Mac, ça arrive) : la mise à jour express part
  # quand même, puisque les tests et la construction Windows avec son selftest ont réussi. Un vrai échec du Mac la bloque.
  express:
    needs: [tests, windows, mac]
    if: ${{ !inputs.captures_seules && !cancelled() && needs.tests.result == 'success' && needs.windows.result == 'success' && needs.mac.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write                        # (joindre le code express et son manifeste à la Release)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Installateurs de cette construction (pour leurs empreintes dans le manifeste)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist-installers
          pattern: Bev-*
          merge-multiple: true

      - name: Code et manifeste de la mise à jour express
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/express.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Bev-mise-a-jour-express
          path: dist-express/*

      # Le manifeste part NON signé : l'auteur le signe ensuite sur son ordinateur (python tools/signer.py signer vX.Y.Z)
      # et joint bev-maj.json.sig à la Release. Tant que ce n'est pas fait, les Bev qui ont la clé publique ne proposent pas
      # cette version (rien n'est installé par erreur).
      - name: Joindre à la Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.ref_name }}" dist-express/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
