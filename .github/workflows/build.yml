# Construit Bev à chaque envoi de code :
#  - Windows : un INSTALLATEUR (Bev-Setup-x.y.z.exe : menu Démarrer, raccourci, désinstallation, mises à jour) ;
#  - Mac : une image disque (.dmg).
# Et les attache automatiquement à chaque « Release » publiée (v1.1.0, v1.1.1…).
name: Construire Bev

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: ffmpeg (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item fftmp\*\bin\ffmpeg.exe, fftmp\*\bin\ffprobe.exe, fftmp\*\bin\ffplay.exe ffmpeg\
          ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Icône, image de démarrage, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      # Application en DOSSIER (et non plus en un seul .exe) : plus de décompression de 260 Mo à chaque lancement,
      # Bev s'ouvre en quelques secondes ; l'image de démarrage s'affiche dès le double-clic.
      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name Bev
          --icon build/icon.ico
          --splash build/splash.png
          --add-binary "ffmpeg/ffmpeg.exe;bin"
          --add-binary "ffmpeg/ffprobe.exe;bin"
          --add-binary "ffmpeg/ffplay.exe;bin"
          --collect-all sounddevice
          --hidden-import pyaudiowpatch
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Vérification automatique (selftest)
        shell: pwsh
        run: |
          $env:PYINSTALLER_SUPPRESS_SPLASH_SCREEN = "1"
          $p = Start-Process -FilePath dist\Bev\Bev.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest en échec" }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content build\version.txt).Trim()
          & $iscc "/DMyAppVersion=$ver" installer\bev.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en échec" }
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: Bev-Windows-installateur
          path: |
            dist-installer/Bev-Setup-*.exe
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $f = Get-ChildItem dist-installer\Bev-Setup-*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $f.FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: ffmpeg (Mac)
        run: |
          mkdir -p ffmpeg
          for t in ffmpeg ffprobe ffplay; do
            curl -fsSL -o "$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip"
            unzip -o -q "$t.zip" -d ffmpeg
          done
          chmod +x ffmpeg/*
          ffmpeg/ffmpeg -version | head -1

      - name: Icône, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Bev
          --icon build/icon.icns
          --osx-bundle-identifier fr.radio.bev
          --add-binary "ffmpeg/ffmpeg:bin"
          --add-binary "ffmpeg/ffprobe:bin"
          --add-binary "ffmpeg/ffplay:bin"
          --collect-all sounddevice
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Autorisation micro + signature locale
        run: |
          P=dist/Bev.app/Contents/Info.plist
          plutil -insert NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P" || \
          plutil -replace NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P"
          plutil -insert NSHighResolutionCapable -bool true "$P" || true
          codesign --force --deep --sign - dist/Bev.app

      - name: Vérification automatique (selftest)
        run: |
          QT_QPA_PLATFORM=offscreen dist/Bev.app/Contents/MacOS/Bev --selftest
          cat selftest.txt

      - name: Image disque (.dmg)
        run: |
          mkdir -p dmg && cp -R dist/Bev.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Bev -srcfolder dmg -ov -format UDZO Bev-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Bev-macOS
          path: |
            Bev-macOS.dmg
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.ref_name }}" Bev-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
