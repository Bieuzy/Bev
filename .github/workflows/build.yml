# Construit Bev à chaque envoi de code :
#  - Windows : un INSTALLATEUR (Bev-Setup-x.y.z.exe : menu Démarrer, raccourci, désinstallation, mises à jour) ;
#  - Mac : une image disque (.dmg).
# Et les attache automatiquement à chaque « Release » publiée (v1.1.0, v1.1.1…).
name: Construire Bev

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Signature de code Windows (facultative, recommandée) : avec un compte Azure Artifact Signing (ex-Trusted Signing),
# l'exécutable et l'installateur sont signés au nom de l'éditeur : SmartScreen, Smart App Control et les antivirus les
# reconnaissent. Pour l'activer, renseigner dans Settings > Secrets and variables > Actions :
#   secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   variables AZURE_SIGN_ENDPOINT (ex. https://weu.codesigning.azure.net/), AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE
# Sans ces réglages, la construction se fait comme avant (non signée).
env:
  SIGN: ${{ vars.AZURE_SIGN_ACCOUNT != '' && 'oui' || '' }}

jobs:
  # Tests automatiques (tests/) et vérification de l'interface depuis le code source, avant toute publication.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg et bibliothèques système de Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Vérification de l'interface (selftest, depuis le code source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python broadcast_tool_qt.py --selftest || { cat selftest.txt; exit 1; }
          cat selftest.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: ffmpeg (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item fftmp\*\bin\ffmpeg.exe, fftmp\*\bin\ffprobe.exe, fftmp\*\bin\ffplay.exe ffmpeg\
          ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Icône, image de démarrage, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      # Application en DOSSIER (et non plus en un seul .exe) : plus de décompression de 260 Mo à chaque lancement,
      # Bev s'ouvre en quelques secondes ; l'image de démarrage s'affiche dès le double-clic.
      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name Bev
          --icon build/icon.ico
          --splash build/splash.png
          --add-binary "ffmpeg/ffmpeg.exe;bin"
          --add-binary "ffmpeg/ffprobe.exe;bin"
          --add-binary "ffmpeg/ffplay.exe;bin"
          --collect-all sounddevice
          --hidden-import pyaudiowpatch
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Signature de Bev.exe et des outils (si configurée)
        if: env.SIGN == 'oui'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Bev
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Vérification automatique (selftest)
        shell: pwsh
        run: |
          $env:PYINSTALLER_SUPPRESS_SPLASH_SCREEN = "1"
          $p = Start-Process -FilePath dist\Bev\Bev.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest en échec" }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Get-Content build\version.txt).Trim()
          & $iscc "/DMyAppVersion=$ver" installer\bev.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en échec" }
          Get-ChildItem dist-installer

      - name: Signature de l'installateur (si configurée)
        if: env.SIGN == 'oui'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: Bev-Windows-installateur
          path: |
            dist-installer/Bev-Setup-*.exe
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $f = Get-ChildItem dist-installer\Bev-Setup-*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $f.FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modules Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: ffmpeg (Mac)
        run: |
          mkdir -p ffmpeg
          for t in ffmpeg ffprobe ffplay; do
            curl -fsSL -o "$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip"
            unzip -o -q "$t.zip" -d ffmpeg
          done
          chmod +x ffmpeg/*
          ffmpeg/ffmpeg -version | head -1

      - name: Icône, version et dépôt
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/prepare.py

      - name: Construction (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name Bev
          --icon build/icon.icns
          --osx-bundle-identifier fr.radio.bev
          --add-binary "ffmpeg/ffmpeg:bin"
          --add-binary "ffmpeg/ffprobe:bin"
          --add-binary "ffmpeg/ffplay:bin"
          --collect-all sounddevice
          --hidden-import PySide6.QtNetwork
          broadcast_tool_qt.py

      - name: Autorisation micro + signature locale
        run: |
          P=dist/Bev.app/Contents/Info.plist
          plutil -insert NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P" || \
          plutil -replace NSMicrophoneUsageDescription -string "Bev capte l'entrée audio choisie pour la diffuser à l'antenne." "$P"
          plutil -insert NSHighResolutionCapable -bool true "$P" || true
          codesign --force --deep --sign - dist/Bev.app

      - name: Vérification automatique (selftest)
        run: |
          QT_QPA_PLATFORM=offscreen dist/Bev.app/Contents/MacOS/Bev --selftest
          cat selftest.txt

      - name: Image disque (.dmg)
        run: |
          mkdir -p dmg && cp -R dist/Bev.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Bev -srcfolder dmg -ov -format UDZO Bev-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Bev-macOS
          path: |
            Bev-macOS.dmg
            selftest.txt

      - name: Joindre à la Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.ref_name }}" Bev-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Mise à jour express : le code de cette version (~1 Mo) + son manifeste, joints à la Release. Les Bev déjà installés
  # passent à la nouvelle version sans installateur (voir tools/express.py et _express_boot dans broadcast_tool_qt.py).
  # needs : le code express n'est joint à la Release qu'une fois les tests, les deux constructions ET leur selftest réussis. Avant, il
  # partait en parallèle : une version qui ne démarrait pas était quand même proposée en express à tous les Bev installés.
  express:
    needs: [tests, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Code et manifeste de la mise à jour express
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: python tools/express.py

      - uses: actions/upload-artifact@v4
        with:
          name: Bev-mise-a-jour-express
          path: dist-express/*

      - name: Joindre à la Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.ref_name }}" dist-express/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
